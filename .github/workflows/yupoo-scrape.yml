name: Yupoo scrape temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/yupoo-scrape.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape Yupoo albums
        shell: bash
        run: |
          cat > /tmp/scrape.py <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from playwright.async_api import async_playwright

          OUT = Path('yupoo_output')
          OUT.mkdir(exist_ok=True)

          fixed = [
              ('P1180-3311-A', 'https://scarlettluxury.x.yupoo.com/albums/189867318'),
              ('P1180-3311-B', 'https://scarlettluxury.x.yupoo.com/albums/189867316'),
              ('P950-2501', 'https://scarlettluxury.x.yupoo.com/albums/223410610?isSubCate=false&referrercate=4064059&uid=1'),
          ]
          wanted_codes = [
              'P1030 - 5251',
              'P1050 - 0571',
              'P1050 - 1112',
              'P1050 - 3831',
              'P1100 - 1091',
              'P1200 - 4731',
              'P1100 - 0991',
          ]

          def clean_name(s):
              return re.sub(r'[^A-Za-z0-9._-]+', '_', s).strip('_')[:100]

          async def resolve_album_links(page):
              await page.goto('https://scarlettluxury.x.yupoo.com/albums/?page=1', wait_until='domcontentloaded', timeout=90000)
              await page.wait_for_timeout(4000)
              links = await page.locator('a[href*="/albums/"]').evaluate_all("els => els.map(a => ({text:(a.innerText||a.textContent||'').trim(), href:a.href}))")
              resolved = []
              used = set()
              for code in wanted_codes:
                  candidates = [x for x in links if code.lower() in x['text'].lower() and x['href'] not in used]
                  resolved.append((clean_name(code), candidates[0]['href'] if candidates else None))
                  if candidates: used.add(candidates[0]['href'])
              return resolved

          async def scrape_album(context, label, url):
              result = {'label': label, 'url': url, 'title': None, 'imageUrls': [], 'savedFiles': [], 'error': None}
              if not url:
                  result['error'] = 'album URL not resolved'
                  return result
              page = await context.new_page()
              seen = set()
              try:
                  def on_response(resp):
                      u = resp.url
                      ct = (resp.headers or {}).get('content-type','')
                      if ('image' in ct.lower() or re.search(r'\.(jpe?g|png|webp)(\?|$)', u, re.I)) and ('yupoo' in u.lower() or 'photo' in u.lower()):
                          seen.add(u)
                  page.on('response', on_response)
                  await page.goto(url, wait_until='domcontentloaded', timeout=90000)
                  await page.wait_for_timeout(3000)
                  for y in [600, 1200, 2400, 5000, 9000, 15000]:
                      await page.evaluate(f'window.scrollTo(0,{y})')
                      await page.wait_for_timeout(650)
                  await page.evaluate('window.scrollTo(0,0)')
                  await page.wait_for_timeout(1200)
                  result['title'] = await page.title()

                  attrs = await page.locator('img').evaluate_all("""els => els.flatMap(img => {
                    const vals=[];
                    for (const a of ['src','data-src','data-original','data-origin-src','data-lazy-src','data-url','data-ks-lazyload']) {
                      const v=img.getAttribute(a); if(v) vals.push(v);
                    }
                    if(img.currentSrc) vals.push(img.currentSrc);
                    const ss=img.getAttribute('srcset'); if(ss) ss.split(',').forEach(x=>vals.push(x.trim().split(/\\s+/)[0]));
                    return vals;
                  })""")
                  for v in attrs:
                      if v and not v.startswith(('data:','blob:')):
                          seen.add(urljoin(page.url, v))

                  urls=[]
                  for u in seen:
                      lu=u.lower()
                      if any(x in lu for x in ['avatar','logo','favicon','qrcode','qr_code','weibo','icon']): continue
                      if not ('yupoo' in lu or 'photo' in lu): continue
                      if re.search(r'\.(jpe?g|png|webp)(\?|$)', lu) or 'photo.yupoo.com' in lu: urls.append(u)
                  urls=list(dict.fromkeys(sorted(urls)))
                  result['imageUrls']=urls

                  folder=OUT/clean_name(label); folder.mkdir(exist_ok=True)
                  for i,u in enumerate(urls[:30],1):
                      try:
                          r=await context.request.get(u, headers={'Referer':page.url}, timeout=60000)
                          if not r.ok: continue
                          body=await r.body(); ct=(r.headers or {}).get('content-type','')
                          ext='.png' if 'png' in ct else '.webp' if 'webp' in ct else '.jpg'
                          fp=folder/f'{i:02d}{ext}'; fp.write_bytes(body)
                          if fp.stat().st_size > 5000: result['savedFiles'].append(str(fp))
                          else: fp.unlink(missing_ok=True)
                      except Exception: pass
              except Exception as e:
                  result['error']=repr(e)
              finally:
                  await page.close()
              return result

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled'])
                  context=await browser.new_context(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/127 Safari/537.36', viewport={'width':1440,'height':1200}, locale='en-US')
                  page=await context.new_page(); resolved=await resolve_album_links(page); await page.close()
                  results=[]
                  for label,url in fixed+resolved:
                      print('SCRAPE',label,url,flush=True)
                      results.append(await scrape_album(context,label,url))
                  await browser.close()
                  (OUT/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
                  print(json.dumps(results,ensure_ascii=False,indent=2))
          asyncio.run(main())
          PY
          python /tmp/scrape.py

      - name: Upload scraped images
        uses: actions/upload-artifact@v4
        with:
          name: yupoo-images
          path: yupoo_output
          if-no-files-found: error
          retention-days: 1
