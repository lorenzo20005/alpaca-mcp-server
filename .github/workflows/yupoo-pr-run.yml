name: Yupoo PR scrape temp

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
      - name: Scrape
        run: python tools/yupoo_scrape_temp.py
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: yupoo-images
          path: yupoo_output
          if-no-files-found: error
          retention-days: 1
